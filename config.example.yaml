# auto2api 配置：支持多套命名链，外部按 model=链名 调用不同优先级组
# 客户端请求体里 "model" 字段填链名（如 "auto" / "cn"），即按对应链的优先级 fallback
# 复制本文件为 config.yaml 并填入真实凭据后使用
server:
  addr: ":8080"
  max_model_switches: 5          # 单次请求最多切换模型次数（兜底，防雪崩）
  api_keys:                      # 服务级鉴权 key，客户端调用须在 Authorization: Bearer <key> 填其中之一；为空则不鉴权
    - "sk-auto2api-CHANGE_ME"     # 可配多个方便轮换；支持 ${ENV} 展开
    # - "${AUTO2API_KEY2}"

# 调用日志：记录完整调用过程与输入输出，按日期 + 大小轮转（logs/calls-YYYY-MM-DD.log）
log:
  enabled: false                  # 总开关，默认关闭
  dir: "logs"                     # 日志目录（按日期 + 大小轮转）
  redact_keys: true               # 脱敏 Authorization / x-api-key，避免凭据泄露
  body_limit: 8192               # 请求/响应体记录上限（字节），超出截断
  log_upstream: true              # 是否记录转发到上游的请求体
  log_resp_body: true             # 是否记录响应体（关闭可大幅减小日志体积）
  max_size_mb: 100               # 单文件大小上限（MB），超出后按 .1/.2 后缀轮转
  max_age_days: 7                # 日志最大保留天数，超期自动删除
  max_backups: 10                # 每天最多保留的轮转文件数，超出删最旧
  compress: true                 # 轮转后的旧文件自动 gzip 压缩

# 熔断器（可选，默认关闭）。叠加在 failover.cooldown 之上：
# 单次失败 → cooldown 短期冷却；连续失败达阈值 → 熔断 OPEN，期间所有请求直接跳过该模型，
# 冷却到期转 HALF_OPEN 仅放行少量探测请求，探测成功 → CLOSED，探测失败 → 重新 OPEN。
# 与 failover 的区别：cooldown 是“一次失败后短期避让”，熔断是“连续失败后长期摘除 + 半开探测恢复”。
breaker:
  enabled: false                  # 总开关，默认关闭
  failure_threshold: 5            # 连续失败多少次进入 OPEN
  open_duration: "60s"            # OPEN 持续时间，到期转 HALF_OPEN
  half_open_max: 1                # HALF_OPEN 允许的并发探测请求数（通常 1）

# 后台主动健康检查（可选，默认关闭）。启用后周期性对每个上游模型发 max_tokens=1 的最小请求，
# 探活失败反馈熔断器触发 OPEN，探活成功复位熔断器 CLOSED。
# 不经过业务调用日志与指标（探活结果也会反馈给熔断器，但不计入业务指标的延迟/成功率）。
health_check:
  enabled: false                  # 总开关，默认关闭
  interval: "30s"                # 探活周期
  timeout: "10s"                 # 单次探活请求超时

# 服务保护（防崩溃三板斧，各项可选，值为 0 / 空表示禁用）：
#   1. 并发限流：防上游 API 超时导致连接无限堆积撑爆内存/句柄
#   2. 内存守护：防内存泄漏或 OOM，超阈值自动降级（拒新请求 + 强制 GC）
#   3. panic recovery：自动启用，捕获未捕获异常防进程退出（无需配置）
protection:
  # 并发限流
  max_concurrent: 200            # 最大并发处理请求数，0=不限制；超出则进队列等待
  max_queue_size: 400            # 等待队列长度，0=自动(2x max_concurrent)；队列满直接返回 503
  queue_timeout: "30s"           # 队列等待超时，超时返回 503 + Retry-After，避免请求无限堆积
  # 内存守护
  max_memory_mb: 10024            # 进程最大允许内存(MB)，0=不监控；建议设为容器内存上限的 80%
  memory_warn: 0.8               # 警告阈值(占 max_memory_mb 比例)，超过则主动 GC + 日志告警
  memory_critical: 0.9           # 临界阈值，超过则拒绝新请求(503)并强制 GC，回落后自动恢复
  memory_check_interval: "10s"   # 内存检查周期

chains:
  # 默认链：gpt -> glm -> claude 三级 fallback
  auto:
    - name: gpt              # 优先级 1（最高）
      priority: 1
      upstream:
        provider: openai
        base_url: "https://api.openai.com/v1"   # OpenAI 兼容端点会自动追加 /v1/chat/completions
        model: "gpt-4o"        # 上游真实模型名（模型映射）
        api_key: "${OPENAI_KEY}"                # 支持 ${ENV} 环境变量展开
        auth_header: "Authorization"            # 或 x-api-key / x-goog-api-key
        timeout: "120s"
      retry:
        count: 2                                # 同模型内重试次数（不含首次）
        backoff: ["300ms", "600ms", "1.2s"]     # 指数退避，封顶 3s
        retryable_status: [429, 500, 502, 503, 529]
      failover:
        trigger_status: [401, 403, 429, 500, 502, 503, 529]   # 触发切换下一优先级
        cooldown: "60s"                         # 失败后该模型冷却不可用时间
      stream:
        idle_timeout: "30s"                     # SSE 无数据超时
        keepalive: "5s"                          # SSE ping 间隔

    - name: glm             # 优先级 2
      priority: 2
      upstream:
        provider: openai
        base_url: "https://open.bigmodel.cn/api/paas/v4"
        model: "glm-4-plus"
        api_key: "${GLM_KEY}"
        auth_header: "Authorization"
        timeout: "120s"
      retry:
        count: 2
        backoff: ["300ms", "600ms"]
        retryable_status: [429, 500, 502]
      failover:
        trigger_status: [401, 403, 429, 500, 502, 503]
        cooldown: "60s"
      stream:
        idle_timeout: "30s"
        keepalive: "5s"

    - name: claude            # 优先级 3（兜底）
      priority: 3
      upstream:
        provider: anthropic
        base_url: "https://api.anthropic.com"
        model: "claude-3-5-sonnet-20241022"
        api_key: "${ANTHROPIC_KEY}"
        auth_header: "x-api-key"              # Anthropic 用 x-api-key
        timeout: "120s"
      retry:
        count: 1
        retryable_status: [429, 500]
      failover:
        trigger_status: [500, 502, 503]
        cooldown: "30s"
      stream:
        idle_timeout: "30s"
        keepalive: "5s"

  # 第二套链：仅国产模型
  cn:
    - name: deepseek-cn
      priority: 1
      upstream:
        base_url: "https://api.deepseek.com"
        model: "deepseek-chat"
        api_key: "${DEEPSEEK_KEY}"
        auth_header: "Authorization"
        timeout: "120s"
      retry:
        count: 2
        backoff: ["300ms", "600ms"]
        retryable_status: [429, 500]
      failover:
        trigger_status: [401, 403, 429, 500]
        cooldown: "60s"
      stream:
        idle_timeout: "30s"
        keepalive: "5s"

    - name: qwen
      priority: 2
      upstream:
        base_url: "https://dashscope.aliyuncs.com/compatible-mode"
        model: "qwen-plus"
        api_key: "${QWEN_KEY}"
        auth_header: "Authorization"
        timeout: "120s"
      retry:
        count: 1
        retryable_status: [429]
      failover:
        trigger_status: [401, 403, 429, 500]
        cooldown: "60s"
      stream:
        idle_timeout: "30s"
        keepalive: "5s"
